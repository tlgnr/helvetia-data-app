target-version = "py311"
src = ["src/app", "tests"]

# Keep CI to syntax/undefined-name issues. The diagnostics helper is meant
# never to raise into the host app, so bandit-style rules are the wrong bar.
[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
"src/app/app.py" = ["E402"]
"src/app/app_diagnostics.py" = ["ALL"]
