bundle:
  name: helvetia-data-app

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: Serverless SQL warehouse used by the app
    lookup:
      warehouse: helvetia-wh
  secret_scope:
    description: Databricks-backed secret scope that holds external-api-key
    default: helvetia-app
  deploy_sp_client_id:
    description: Application ID of the environment deploy SP (dev/test/prod run_as). Unused on the personal target.
    default: ""

# personal = laptop (development mode prefixes resources with the user).
# dev/test/prod = shared workspaces, stable app names, CI run_as the env SP.
targets:
  personal:
    default: true
    mode: development

  dev:
    mode: production
    workspace:
      root_path: /Workspace/Users/${var.deploy_sp_client_id}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.deploy_sp_client_id}

  test:
    mode: production
    workspace:
      root_path: /Workspace/Users/${var.deploy_sp_client_id}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.deploy_sp_client_id}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${var.deploy_sp_client_id}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.deploy_sp_client_id}
